name: Build & publish bundle SSR (o2switch)

# On ne build PAS sur o2switch (outils natifs incompatibles : esbuild, moteur Tailwind…).
# Ce workflow build le site sur un runner GitHub (Linux récent, prebuilds OK) puis
# publie un bundle PRÊT À L'EMPLOI (pur JS au runtime) sur une branche de déploiement.
# o2switch n'a plus qu'à : git fetch && git reset --hard && restart.
#
# UN SEUL ENVIRONNEMENT, depuis le 2026-08-07
#   main -> branche `deploy` -> application ~/mb74-site -> motorboat74.com
#
# La préprod a été retirée : staging.motorboat74.com ne sert plus l'application et
# le domaine public a été basculé sur ~/mb74-site. Pousser sur `main` publie donc
# directement ce que verront les visiteurs.
#
# La branche `production` -> `deploy-prod` -> ~/mb74-prod est conservée ci-dessous
# mais plus rien ne la sert. Ne pas la réactiver sans avoir d'abord rebranché un
# domaine dessus, sinon on publie dans le vide en croyant mettre en ligne.

on:
  push:
    branches: [main, production]
  workflow_dispatch:

permissions:
  contents: write

# Une file par branche source : deux publications successives sur `main` ne se
# marchent pas dessus, seule la plus récente aboutit.
concurrency:
  group: deploy-bundle-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install deps
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1' # Chromium inutile pour le build SSR

      - name: Typecheck
        run: npm run lint

      - name: Build SSR
        run: npm run build:ssr

      # Garde-fou repris de publish.sh : c'est le contrôle qui aurait évité les
      # 53 pages prérendues vides restées en ligne pendant des semaines. Il
      # n'existait que dans le script local ; Actions publiait sans filet.
      - name: Contrôle qualité du prerender
        run: |
          node -e '
          const fs=require("fs"),path=require("path");
          const root="build/client";let bad=[],ok=0;
          (function walk(d){for(const e of fs.readdirSync(d,{withFileTypes:true})){const p=path.join(d,e.name);
           if(e.isDirectory())walk(p);
           else if(e.name==="index.html"){
            const s=fs.readFileSync(p,"utf8");
            const m=s.match(/<div id="root"[^>]*>([\s\S]*)<\/div>\s*<script/)||s.match(/<body[^>]*>([\s\S]*?)<\/body>/);
            const t=(m?m[1]:"").replace(/<script[\s\S]*?<\/script>/g," ").replace(/<[^>]+>/g," ").replace(/\s+/g," ").trim();
            const r="/"+path.relative(root,path.dirname(p));
            // /admin est un shell de connexion volontairement vide (noindex).
            if(t.length<300){ if(r!=="/admin") bad.push(r); } else ok++;
           }}})(root);
          console.log(`${ok} pages avec contenu`);
          if(bad.length){console.log("PAGES VIDES :");bad.forEach(b=>console.log(" -",b));process.exit(2);}
          '

      - name: Assembler le bundle de déploiement
        run: |
          rm -rf deploy-bundle
          mkdir -p deploy-bundle
          cp -r build deploy-bundle/build
          cp -r server deploy-bundle/server
          cp package.json package-lock.json deploy-bundle/
          cp .env.example deploy-bundle/ 2>/dev/null || true
          # NB : pas de symlinks Apache. Comme le site Ilico (qui tourne sans souci sur
          # o2switch), TOUT est servi par l'app Express/Node (document + assets) sur la même
          # connexion. Mélanger Apache (assets symlinkés) et Passenger (document) provoquait
          # des 421 (Misdirected Request) en HTTP/2. Express sert les assets via express.static.

      # `git init` à chaque passage réécrit l'historique en force : la branche
      # publiée ne garde aucun bundle antérieur. Pour revenir en arrière, on
      # revient sur `main` et on republie.
      #
      # La branche `deploy-prod` n'alimente plus aucun domaine depuis la bascule.
      - name: Choisir l'environnement
        id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "production" ]; then
            echo "branch=deploy-prod" >> "$GITHUB_OUTPUT"
            echo "dir=~/mb74-prod"    >> "$GITHUB_OUTPUT"
            echo "label=INACTIF — aucun domaine ne sert ~/mb74-prod" >> "$GITHUB_OUTPUT"
          else
            echo "branch=deploy"      >> "$GITHUB_OUTPUT"
            echo "dir=~/mb74-site"    >> "$GITHUB_OUTPUT"
            echo "label=EN LIGNE (motorboat74.com)" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier sur la branche de déploiement
        run: |
          cd deploy-bundle
          git init -q -b "${TARGET}"
          git config user.email "ci@motorboat74.com"
          git config user.name "MB74 CI"
          git add -A
          git commit -q -m "deploy: bundle SSR depuis ${GITHUB_SHA::7} (${GITHUB_REF_NAME})"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${TARGET}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET: ${{ steps.env.outputs.branch }}

      - name: Commande à passer sur o2switch
        run: |
          echo "::notice::${{ steps.env.outputs.label }} — cd ${{ steps.env.outputs.dir }} && git fetch origin && git reset --hard origin/${{ steps.env.outputs.branch }} && mkdir -p tmp && touch tmp/restart.txt"
